```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Communication Skills — MCQ Quiz</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eef4ff, #f8fbff);
        color: #172033;
        padding: 25px 15px;
    }

    .container {
        max-width: 850px;
        margin: auto;
    }

    /* HEADER */
    .header {
        background: linear-gradient(135deg, #3157d5, #6138c7);
        color: white;
        padding: 30px 25px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(49, 87, 213, 0.20);
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .header p {
        font-size: 16px;
        opacity: 0.9;
    }

    /* QUIZ CARD */
    .quiz-card {
        background: white;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        font-weight: 600;
    }

    .question-number {
        color: #3157d5;
    }

    .score {
        background: #eef2ff;
        padding: 7px 13px;
        border-radius: 20px;
        color: #3157d5;
    }

    /* PROGRESS */
    .progress-container {
        width: 100%;
        height: 8px;
        background: #e8ecf5;
        border-radius: 10px;
        margin-bottom: 28px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 5%;
        background: linear-gradient(90deg, #3157d5, #7045d8);
        border-radius: 10px;
        transition: width 0.3s ease;
    }

    .question {
        font-size: 21px;
        line-height: 1.5;
        font-weight: 650;
        margin-bottom: 22px;
    }

    /* OPTIONS */
    .options {
        display: flex;
        flex-direction: column;
        gap: 13px;
    }

    .option {
        border: 2px solid #e5e9f2;
        border-radius: 13px;
        padding: 15px 17px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        background: #fff;
    }

    .option:hover {
        border-color: #6a7fe0;
        background: #f6f8ff;
        transform: translateX(3px);
    }

    .option.selected {
        border-color: #3157d5;
        background: #eef2ff;
    }

    .option input {
        display: none;
    }

    .letter {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 50%;
        background: #edf0f6;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #465064;
    }

    .option.selected .letter {
        background: #3157d5;
        color: white;
    }

    /* BUTTONS */
    .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 28px;
        gap: 12px;
    }

    button {
        border: none;
        padding: 13px 25px;
        border-radius: 11px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .prev-btn {
        background: #edf0f5;
        color: #333d50;
    }

    .next-btn,
    .submit-btn {
        background: #3157d5;
        color: white;
    }

    button:hover {
        transform: translateY(-2px);
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .submit-btn {
        background: #16864a;
    }

    /* RESULT */
    .result {
        display: none;
        text-align: center;
        padding: 20px 10px;
    }

    .result-icon {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #e7f8ee;
        color: #16864a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
        margin: 0 auto 18px;
    }

    .result h2 {
        font-size: 30px;
        margin-bottom: 10px;
    }

    .result p {
        font-size: 18px;
        color: #606a7c;
        margin-bottom: 20px;
    }

    .final-score {
        font-size: 46px;
        font-weight: 750;
        color: #3157d5;
        margin-bottom: 5px;
    }

    .restart-btn {
        background: #3157d5;
        color: white;
    }

    /* REVIEW */
    .review {
        margin-top: 25px;
        text-align: left;
        display: none;
    }

    .review h3 {
        margin-bottom: 15px;
    }

    .review-item {
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 10px;
        background: #f7f8fb;
        border-left: 4px solid #ccc;
    }

    .review-item.correct {
        border-left-color: #16864a;
    }

    .review-item.wrong {
        border-left-color: #d33c3c;
    }

    .review-question {
        font-weight: 650;
        margin-bottom: 6px;
    }

    .correct-text {
        color: #16864a;
        font-weight: 600;
    }

    .wrong-text {
        color: #d33c3c;
        font-weight: 600;
    }

    /* MOBILE */
    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        .header {
            padding: 24px 15px;
            border-radius: 15px;
        }

        .header h1 {
            font-size: 23px;
        }

        .quiz-card {
            padding: 20px 16px;
        }

        .question {
            font-size: 18px;
        }

        .buttons button {
            padding: 12px 18px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 Communication Skills</h1>
        <p>Chapter 1 • MCQ Quiz</p>
    </div>

    <div class="quiz-card">

        <div id="quiz">

            <div class="top-bar">
                <span class="question-number" id="questionNumber">
                    Question 1 of 20
                </span>

                <span class="score" id="liveScore">
                    Score: 0
                </span>
            </div>

            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question" id="question"></div>

            <div class="options" id="options"></div>

            <div class="buttons">
                <button class="prev-btn" id="prevBtn" onclick="previousQuestion()">
                    ← Previous
                </button>

                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                    Next →
                </button>

                <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">
                    Submit Quiz
                </button>
            </div>

        </div>

        <!-- RESULT -->
        <div class="result" id="result">

            <div class="result-icon">✓</div>

            <h2>Quiz Completed!</h2>

            <div class="final-score" id="finalScore">
                0/20
            </div>

            <p id="resultMessage"></p>

            <button class="restart-btn" onclick="restartQuiz()">
                🔄 Try Again
            </button>

        </div>

        <!-- REVIEW -->
        <div class="review" id="review">
            <h3>📋 Answer Review</h3>
            <div id="reviewContent"></div>
        </div>

    </div>

</div>


<script>

const questions = [

{
    question: "The word 'Communication' comes from the Latin word commūnicāre, which means:",
    options: ["To speak", "To share", "To listen", "To write"],
    answer: 1
},

{
    question: "Which of the following is a main purpose of communication according to the textbook?",
    options: ["To inform", "To influence", "To express feelings", "All of the above"],
    answer: 3
},

{
    question: "Receiving information in the communication cycle involves which pair of actions?",
    options: ["Speaking and writing", "Reading and listening", "Speaking and reading", "Writing and listening"],
    answer: 1
},

{
    question: "Which principle is NOT part of the 7 Cs of effective communication?",
    options: ["Clear", "Concise", "Complex", "Courteous"],
    answer: 2
},

{
    question: "Trying to read a book while someone else is watching TV in the same room is an example of which type of communication barrier?",
    options: ["Language barrier", "Emotional barrier", "Environmental barrier", "Cultural barrier"],
    answer: 2
},

{
    question: "Verbal communication is defined as the sharing of information by using:",
    options: ["Body postures", "Words", "Signs and traffic signals", "Facial expressions"],
    answer: 1
},

{
    question: "Which of the following is an example of oral or spoken communication?",
    options: ["Newspapers", "Reports", "Face-to-face conversation", "Notes"],
    answer: 2
},

{
    question: "What does the 3Ps method of public speaking stand for?",
    options: ["Plan, Practice, Perform", "Prepare, Practice, Perform", "Prepare, Proofread, Perform", "Present, Practice, Perform"],
    answer: 1
},

{
    question: "What is a key advantage of verbal communication?",
    options: [
        "It overcomes all cultural and accent differences easily",
        "It is quick, easy, and provides immediate feedback",
        "It requires no language knowledge",
        "It prevents all confusion"
    ],
    answer: 1
},

{
    question: "Non-verbal communication involves exchanging messages using:",
    options: [
        "Written letters and emails",
        "Expressions, gestures, postures, and touch",
        "Spoken words on the phone",
        "Textbooks and newspapers"
    ],
    answer: 1
},

{
    question: "In non-verbal communication, what does a firm handshake usually indicate?",
    options: ["Anger", "Hesitation", "Confidence", "Disrespect"],
    answer: 2
},

{
    question: "What is a major advantage of visual communication?",
    options: [
        "It uses long explanatory paragraphs",
        "You do not need to know any particular language to understand it",
        "It requires phone connectivity",
        "It only works in academic settings"
    ],
    answer: 1
},

{
    question: "A group of words that communicates a complete thought is called a:",
    options: ["Phrase", "Clause", "Sentence", "Noun"],
    answer: 2
},

{
    question: "Sentences in which the subject does the action are said to be in the:",
    options: ["Active voice", "Passive voice", "Imperative voice", "Exclamatory voice"],
    answer: 0
},

{
    question: "If you meet someone at 10:00 AM, the appropriate time-based greeting to use is:",
    options: ["Good Afternoon", "Good Evening", "Good Morning", "Good Night"],
    answer: 2
},

{
    question: "Informal greetings are used when speaking to:",
    options: [
        "School principals",
        "Senior officers at work",
        "Friends and family members",
        "Unknown authorities"
    ],
    answer: 2
},

{
    question: "A noun is defined as a:",
    options: [
        "Doing word that describes an action",
        "Naming word used for a person, place, thing, or idea",
        "Word that joins two sentences",
        "Word that replaces a question mark"
    ],
    answer: 1
},

{
    question: "What is the fundamental definition of a question?",
    options: [
        "A statement declaring a fact",
        "A sentence or request used to get information or test knowledge",
        "An order given to perform a task",
        "An exclamatory expression of emotion"
    ],
    answer: 1
},

{
    question: "Which of the following is an example of an open-ended question?",
    options: [
        "Are you hungry?",
        "Did you meet him?",
        "Where do you live?",
        "Is it raining outside?"
    ],
    answer: 2
},

{
    question: "What is the correct way to convert the sentence 'You are studying' into a question?",
    options: [
        "You are studying?",
        "Are you studying?",
        "Studying you are?",
        "Studying are you?"
    ],
    answer: 1
}

];


let currentQuestion = 0;
let selectedAnswers = new Array(questions.length).fill(null);


/* LOAD QUESTION */

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("progress").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    const optionsContainer = document.getElementById("options");

    optionsContainer.innerHTML = "";

    const letters = ["A", "B", "C", "D"];

    q.options.forEach((option, index) => {

        const label = document.createElement("label");

        label.className = "option";

        if (selectedAnswers[currentQuestion] === index) {
            label.classList.add("selected");
        }

        label.innerHTML = `
            <input type="radio"
                   name="option"
                   value="${index}"
                   ${selectedAnswers[currentQuestion] === index ? "checked" : ""}>

            <span class="letter">${letters[index]}</span>

            <span>${option}</span>
        `;

        label.addEventListener("click", function() {

            selectedAnswers[currentQuestion] = index;

            document.querySelectorAll(".option")
                .forEach(opt => opt.classList.remove("selected"));

            label.classList.add("selected");

            updateLiveScore();
        });

        optionsContainer.appendChild(label);

    });

    document.getElementById("prevBtn").disabled =
        currentQuestion === 0;

    if (currentQuestion === questions.length - 1) {

        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("submitBtn").style.display = "block";

    } else {

        document.getElementById("nextBtn").style.display = "block";
        document.getElementById("submitBtn").style.display = "none";
    }

}


/* NEXT */

function nextQuestion() {

    if (selectedAnswers[currentQuestion] === null) {

        alert("Please select an answer first.");

        return;
    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();
    }
}


/* PREVIOUS */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();
    }
}


/* SCORE */

function calculateScore() {

    let score = 0;

    questions.forEach((q, index) => {

        if (selectedAnswers[index] === q.answer) {
            score++;
        }

    });

    return score;
}


/* LIVE SCORE */

function updateLiveScore() {

    const score = calculateScore();

    document.getElementById("liveScore").textContent =
        `Score: ${score}`;
}


/* SUBMIT */

function submitQuiz() {

    if (selectedAnswers[currentQuestion] === null) {

        alert("Please select an answer first.");

        return;
    }

    const unanswered =
        selectedAnswers.filter(answer => answer === null).length;

    if (unanswered > 0) {

        const proceed = confirm(
            `You have ${unanswered} unanswered question(s).\n\nDo you want to submit anyway?`
        );

        if (!proceed) return;
    }

    const score = calculateScore();

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("review").style.display = "block";

    document.getElementById("finalScore").textContent =
        `${score}/${questions.length}`;

    const percentage =
        Math.round((score / questions.length) * 100);

    let message = "";

    if (percentage >= 90) {
        message = `Excellent! 🌟 You scored ${percentage}%.`;
    }
    else if (percentage >= 75) {
        message = `Great job! 👏 You scored ${percentage}%.`;
    }
    else if (percentage >= 50) {
        message = `Good effort! 👍 Keep practising.`;
    }
    else {
        message = `Keep learning! 📚 Review the chapter and try again.`;
    }

    document.getElementById("resultMessage").textContent =
        message;

    showReview();
}


/* REVIEW */

function showReview() {

    const reviewContent =
        document.getElementById("reviewContent");

    reviewContent.innerHTML = "";

    const letters = ["A", "B", "C", "D"];

    questions.forEach((q, index) => {

        const userAnswer = selectedAnswers[index];

        const isCorrect =
            userAnswer === q.answer;

        const div = document.createElement("div");

        div.className =
            `review-item ${isCorrect ? "correct" : "wrong"}`;

        div.innerHTML = `

            <div class="review-question">
                ${index + 1}. ${q.question}
            </div>

            <div>
                Your Answer:
                <span class="${isCorrect ? "correct-text" : "wrong-text"}">
                    ${
                        userAnswer !== null
                        ? letters[userAnswer] + ". " + q.options[userAnswer]
                        : "Not answered"
                    }
                </span>
            </div>

            <div>
                Correct Answer:
                <span class="correct-text">
                    ${letters[q.answer]}. ${q.options[q.answer]}
                </span>
            </div>
        `;

        reviewContent.appendChild(div);

    });
}


/* RESTART */

function restartQuiz() {

    currentQuestion = 0;

    selectedAnswers =
        new Array(questions.length).fill(null);

    document.getElementById("result").style.display = "none";

    document.getElementById("review").style.display = "none";

    document.getElementById("quiz").style.display = "block";

    loadQuestion();

    updateLiveScore();

}


/* START */

loadQuestion();

</script>

</body>
</html>
```
